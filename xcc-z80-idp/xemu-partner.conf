# Iskra Delta Partner RAM banking for XEMU.
#
# The lower 48 KiB is selected between two physical RAM banks. The upper
# 16 KiB is common and remains visible across switches. Partner decodes only
# the low byte of the I/O address and ignores the value transferred.

store.banked.banks = 2
store.banked.size = 0xc000
store.common.size = 0x4000

selector.bank = 0

window.banked.range = 0x0000-0xbfff
window.banked.store = banked
window.banked.selector = bank

window.common.range = 0xc000-0xffff
window.common.store = common

# Any IN or OUT in 0x88-0x8f selects physical bank 1 (internal index 0).
port_rule.bank1.port = 0x0088
port_rule.bank1.port_mask = 0x00f8
port_rule.bank1.selector = bank
port_rule.bank1.value = 0

# Any IN or OUT in 0x90-0x97 selects physical bank 2 (internal index 1).
port_rule.bank2.port = 0x0090
port_rule.bank2.port_mask = 0x00f8
port_rule.bank2.selector = bank
port_rule.bank2.value = 1
